name: Release Desktop App
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-ci:
    uses: ./.github/workflows/ci.yml
  native:
    needs: source-ci
    name: Desktop ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: windows-amd64, os: windows-2025, platform: win, arch: x64, backend: backend.exe, app: 'release/win-unpacked/SuperLink.exe'}
          - {id: darwin-arm64, os: macos-15, platform: mac, arch: arm64, backend: backend, app: 'release/mac-arm64/SuperLink.app/Contents/MacOS/SuperLink'}
          - {id: darwin-amd64, os: macos-15-intel, platform: mac, arch: x64, backend: backend, app: 'release/mac/SuperLink.app/Contents/MacOS/SuperLink'}
    env:
      CGO_ENABLED: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Check version identity
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$EVENT" = "push" ]; then
            node -e 'const p=require("./front/package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("tag and application version differ")'
          fi
      - run: go vet ./...
      - run: go test -timeout=20m ./...
      - run: npm ci
        working-directory: front
      - run: npm run build-react
        working-directory: front
      - name: Build native backend
        working-directory: front
        run: go build -trimpath -o resources_ext/${{ matrix.backend }} ../cmd/app
      - name: Build native installers without publishing
        working-directory: front
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Execute the actual packaged application
        working-directory: front
        run: node scripts/ci-smoke.cjs --app "${{ matrix.app }}"
      - name: Verify macOS disk images
        if: runner.os == 'macOS'
        working-directory: front
        shell: bash
        run: |
          found=0
          for image in release/*.dmg; do
            test -f "$image"
            hdiutil verify "$image"
            found=$((found + 1))
          done
          test "$found" -ge 1
      - name: Record candidate checksums
        env:
          PLATFORM: ${{ matrix.id }}
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          root = Path("front/release")
          files = [p for p in root.iterdir() if p.suffix in (".exe", ".dmg", ".blockmap")]
          if not files:
              raise SystemExit("no release installers were produced")
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name for p in sorted(files)]
          (root / ("SHA256SUMS-" + os.environ["PLATFORM"] + ".txt")).write_text("\n".join(lines) + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}-${{ github.sha }}
          path: |
            front/release/*.exe
            front/release/*.dmg
            front/release/*.blockmap
            front/release/SHA256SUMS-*.txt
          if-no-files-found: error
  release-gate:
    name: Release CI
    if: ${{ always() }}
    needs: [source-ci, native]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          failed = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Release acceptance failed: {failed}")
  publish:
    if: github.event_name == 'push'
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-${{ github.sha }}
          path: candidate
          merge-multiple: true
      - name: Verify every installer before publication
        working-directory: candidate
        run: |
          test "$(find . -name 'SHA256SUMS-*.txt' | wc -l)" -eq 3
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            candidate/*.exe
            candidate/*.dmg
            candidate/*.blockmap
            candidate/SHA256SUMS.txt
          fail_on_unmatched_files: true
